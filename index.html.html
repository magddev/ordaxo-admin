<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ordaxo — لوحة التحكم</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --primary: #6C63FF;
    --success: #10B981;
    --warning: #F59E0B;
    --danger: #EF4444;
    --bg: #0F1117;
    --surface: #1A1D2E;
    --surface-alt: #252837;
    --border: #2E3147;
    --text: #F3F4F6;
    --text-dim: #9CA3AF;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Cairo', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }
  .hidden { display: none !important; }

  /* ── شاشة الدخول ── */
  #loginScreen {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .login-box {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 36px 28px;
    width: 100%;
    max-width: 380px;
    text-align: center;
  }
  .login-box h1 {
    font-size: 24px;
    font-weight: 800;
    margin-bottom: 6px;
    background: linear-gradient(135deg, #6C63FF, #9B59B6);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .login-box p { color: var(--text-dim); font-size: 13px; margin-bottom: 24px; }
  input[type="email"] {
    width: 100%;
    padding: 13px 14px;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: var(--surface-alt);
    color: var(--text);
    font-family: 'Cairo', sans-serif;
    font-size: 14px;
    margin-bottom: 12px;
    text-align: center;
  }
  input[type="email"]:focus { outline: none; border-color: var(--primary); }
  .btn {
    width: 100%;
    padding: 13px;
    border-radius: 12px;
    border: none;
    background: var(--primary);
    color: white;
    font-family: 'Cairo', sans-serif;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    transition: opacity .2s;
  }
  .btn:hover { opacity: .9; }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .btn-outline {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-dim);
  }
  .btn-sm { padding: 8px 14px; font-size: 12px; width: auto; }
  .btn-danger { background: var(--danger); }
  .btn-success { background: var(--success); }
  #loginMsg { font-size: 12px; margin-top: 12px; min-height: 16px; }

  /* ── لوحة التحكم ── */
  #dashboard { display: none; }
  header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 14px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 10;
  }
  header h1 { font-size: 16px; font-weight: 800; }
  header .user-email { font-size: 12px; color: var(--text-dim); margin-inline-end: 12px; }

  .tabs {
    display: flex;
    gap: 4px;
    padding: 12px 24px 0;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
  }
  .tab {
    padding: 10px 18px;
    border-radius: 10px 10px 0 0;
    cursor: pointer;
    font-size: 13px;
    font-weight: 600;
    color: var(--text-dim);
  }
  .tab.active { background: var(--bg); color: var(--primary); }

  main { padding: 24px; max-width: 1100px; margin: 0 auto; }

  .stats-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 12px;
    margin-bottom: 24px;
  }
  .stat-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 16px;
    text-align: center;
  }
  .stat-card .num { font-size: 26px; font-weight: 800; margin-bottom: 4px; }
  .stat-card .label { font-size: 11px; color: var(--text-dim); }

  .search-bar { display: flex; gap: 8px; margin-bottom: 16px; }
  .search-bar input {
    flex: 1;
    padding: 12px 14px;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: var(--surface-alt);
    color: var(--text);
    font-family: 'Cairo', sans-serif;
    font-size: 13px;
  }
  .search-bar input:focus { outline: none; border-color: var(--primary); }

  table { width: 100%; border-collapse: collapse; }
  .table-wrap {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    overflow: hidden;
  }
  th, td {
    padding: 12px 14px;
    text-align: right;
    font-size: 13px;
    border-bottom: 1px solid var(--border);
  }
  th { color: var(--text-dim); font-weight: 600; font-size: 11px; background: var(--surface-alt); }
  tr:last-child td { border-bottom: none; }
  tr.clickable { cursor: pointer; }
  tr.clickable:hover { background: var(--surface-alt); }

  .badge {
    display: inline-block;
    padding: 3px 10px;
    border-radius: 8px;
    font-size: 11px;
    font-weight: 700;
  }
  .badge-active { background: rgba(16,185,129,.15); color: var(--success); }
  .badge-trial { background: rgba(108,99,255,.15); color: var(--primary); }
  .badge-expired { background: rgba(107,114,128,.15); color: #9CA3AF; }
  .badge-on_hold { background: rgba(239,68,68,.15); color: var(--danger); }
  .badge-paused { background: rgba(245,158,11,.15); color: var(--warning); }
  .badge-cancelled { background: rgba(107,114,128,.15); color: #9CA3AF; }

  /* ── مودال تفاصيل عميل ── */
  .modal-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,.6);
    display: flex; align-items: center; justify-content: center;
    z-index: 50; padding: 20px;
  }
  .modal {
    background: var(--surface);
    border-radius: 18px;
    border: 1px solid var(--border);
    width: 100%; max-width: 560px;
    max-height: 88vh; overflow-y: auto;
    padding: 24px;
  }
  .modal-header { display: flex; justify-content: space-between; align-items: start; margin-bottom: 16px; }
  .modal-header h2 { font-size: 17px; font-weight: 800; }
  .close-btn { cursor: pointer; color: var(--text-dim); font-size: 20px; background: none; border: none; }
  .info-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
  .info-row .k { color: var(--text-dim); }
  .section-title { font-size: 12px; font-weight: 700; color: var(--text-dim); margin: 18px 0 8px; text-transform: uppercase; }
  .action-row { display: flex; gap: 8px; margin-top: 16px; flex-wrap: wrap; }
  .mini-list { font-size: 12px; }
  .mini-list-item { padding: 8px 10px; background: var(--surface-alt); border-radius: 10px; margin-bottom: 6px; }
  .empty-note { color: var(--text-dim); font-size: 12px; padding: 12px; text-align: center; }

  .loading { text-align: center; padding: 40px; color: var(--text-dim); font-size: 13px; }
</style>
</head>
<body>

<!-- ═══════════════ شاشة الدخول ═══════════════ -->
<div id="loginScreen">
  <div class="login-box">
    <h1>Ordaxo Admin</h1>
    <p>سجّل دخول بنفس إيميلك المفعّل كأدمن</p>
    <input type="email" id="emailInput" placeholder="admin@example.com">
    <button class="btn" id="loginBtn" onclick="sendMagicLink()">إرسال رابط الدخول</button>
    <div id="loginMsg"></div>
  </div>
</div>

<!-- ═══════════════ الداشبورد ═══════════════ -->
<div id="dashboard">
  <header>
    <h1>📦 Ordaxo — لوحة التحكم</h1>
    <div>
      <span class="user-email" id="userEmailLabel"></span>
      <button class="btn btn-outline btn-sm" onclick="logout()">خروج</button>
    </div>
  </header>

  <div class="tabs">
    <div class="tab active" id="tabCustomers" onclick="switchTab('customers')">العملاء</div>
    <div class="tab" id="tabTickets" onclick="switchTab('tickets')">تذاكر الدعم</div>
  </div>

  <main>
    <div class="stats-grid" id="statsGrid"></div>

    <!-- تاب العملاء -->
    <div id="viewCustomers">
      <div class="search-bar">
        <input type="text" id="searchInput" placeholder="دور بالإيميل / الاسم / رقم الموبايل..." oninput="debouncedSearch()">
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>البيزنس</th>
              <th>الإيميل</th>
              <th>الخطة</th>
              <th>الحالة</th>
              <th>ينتهي</th>
            </tr>
          </thead>
          <tbody id="customersBody">
            <tr><td colspan="5" class="loading">جاري التحميل...</td></tr>
          </tbody>
        </table>
      </div>
    </div>

    <!-- تاب التذاكر -->
    <div id="viewTickets" class="hidden">
      <div class="search-bar">
        <select id="ticketStatusFilter" onchange="loadTickets()" style="padding:12px;border-radius:12px;border:1px solid var(--border);background:var(--surface-alt);color:var(--text);font-family:'Cairo',sans-serif;">
          <option value="">كل الحالات</option>
          <option value="open">مفتوحة</option>
          <option value="in_progress">قيد المعالجة</option>
          <option value="resolved">اتحلت</option>
          <option value="closed">مقفولة</option>
        </select>
      </div>
      <div id="ticketsList"></div>
    </div>
  </main>
</div>

<!-- ═══════════════ مودال تفاصيل عميل ═══════════════ -->
<div id="customerModal" class="modal-overlay hidden" onclick="if(event.target===this) closeModal()">
  <div class="modal" id="customerModalContent"></div>
</div>

<script>
// ⚠️ الـ anon key ده آمن يتحط هنا صراحة — مش سري، ودوره بس يعرّف
// المشروع. الحماية الحقيقية كلها في الـ RLS + دوال is_current_user_admin()
// على السيرفر، مش في إخفاء المفتاح ده.
const SUPABASE_URL = 'https://sipuriesvzlhuyojnnrl.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNpcHVyaWVzdnpsaHV5b2pubnJsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg4NjY2MjIsImV4cCI6MjA5NDQ0MjYyMn0.092_c2j0rwQ2FdBs3kZyDrTc1YZm34q1RsnpPznm9Ug';

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let currentUser = null;
let searchTimer = null;

// ─── Auth ────────────────────────────────────────────────────────────────

async function sendMagicLink() {
  const email = document.getElementById('emailInput').value.trim();
  const msgEl = document.getElementById('loginMsg');
  if (!email) { msgEl.textContent = 'اكتب الإيميل الأول'; msgEl.style.color = '#EF4444'; return; }

  document.getElementById('loginBtn').disabled = true;
  // ⚠️ لازم نحدد صراحة إن رابط الدخول يرجّع لنفس الصفحة دي — من غير كده
  // Supabase بترجّع للـ Site URL الافتراضي بتاع التطبيق نفسه
  // (io.supabase.ordaxo://login-callback)، وده deep link موبايل بس،
  // مش هيفتح حاجة على متصفح كمبيوتر.
  const redirectUrl = window.location.origin + window.location.pathname;
  const { error } = await sb.auth.signInWithOtp({
    email,
    options: { emailRedirectTo: redirectUrl },
  });
  document.getElementById('loginBtn').disabled = false;

  if (error) {
    msgEl.textContent = 'حصل خطأ: ' + error.message;
    msgEl.style.color = '#EF4444';
  } else {
    msgEl.textContent = '✅ اتبعت رابط دخول لإيميلك — افتحه من نفس الجهاز ده';
    msgEl.style.color = '#10B981';
  }
}

async function logout() {
  await sb.auth.signOut();
  location.reload();
}

async function checkSession() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) { showLogin(); return; }

  // تحقق فعلي من is_admin على السيرفر — مش أي حاجة محلية
  const { data: isAdmin, error } = await sb.rpc('is_current_user_admin');
  if (error || !isAdmin) {
    document.getElementById('loginMsg').textContent =
      'الحساب ده مش أدمن — استخدم حساب مفعّل كأدمن';
    document.getElementById('loginMsg').style.color = '#EF4444';
    await sb.auth.signOut();
    showLogin();
    return;
  }

  currentUser = session.user;
  showDashboard();
}

function showLogin() {
  document.getElementById('loginScreen').style.display = 'flex';
  document.getElementById('dashboard').style.display = 'none';
}

function showDashboard() {
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('dashboard').style.display = 'block';
  document.getElementById('userEmailLabel').textContent = currentUser.email;
  loadStats();
  loadCustomers('');
}

sb.auth.onAuthStateChange((event) => {
  if (event === 'SIGNED_IN') checkSession();
});

// ─── Tabs ────────────────────────────────────────────────────────────────

function switchTab(name) {
  document.getElementById('tabCustomers').classList.toggle('active', name === 'customers');
  document.getElementById('tabTickets').classList.toggle('active', name === 'tickets');
  document.getElementById('viewCustomers').classList.toggle('hidden', name !== 'customers');
  document.getElementById('viewTickets').classList.toggle('hidden', name !== 'tickets');
  if (name === 'tickets') loadTickets();
}

// ─── Stats ───────────────────────────────────────────────────────────────

async function loadStats() {
  const { data, error } = await sb.rpc('admin_get_stats');
  if (error) { console.error(error); return; }

  const cards = [
    { num: data.total_customers, label: 'إجمالي التجار' },
    { num: data.active_paid, label: 'مشتركين فعلياً' },
    { num: data.on_trial, label: 'في التجربة' },
    { num: data.on_hold, label: 'مشكلة دفع', color: '#EF4444' },
    { num: data.will_not_renew, label: 'هينتهي (مش هيتجدد)', color: '#F59E0B' },
    { num: data.open_tickets, label: 'تذاكر مفتوحة', color: '#F59E0B' },
  ];

  document.getElementById('statsGrid').innerHTML = cards.map(c => `
    <div class="stat-card">
      <div class="num" style="color:${c.color || '#F3F4F6'}">${c.num ?? 0}</div>
      <div class="label">${c.label}</div>
    </div>
  `).join('');
}

// ─── Customers ───────────────────────────────────────────────────────────

function debouncedSearch() {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => {
    loadCustomers(document.getElementById('searchInput').value.trim());
  }, 350);
}

const STATUS_LABELS = {
  active: 'شغال', expired: 'منتهي', cancelled: 'ملغي',
  on_hold: 'مشكلة دفع', paused: 'متوقف',
};
const PLAN_LABELS = {
  trial: 'تجربة', monthly: 'شهري', biannual: 'نصف سنوي', annual: 'سنوي',
};

async function loadCustomers(query) {
  document.getElementById('customersBody').innerHTML =
    '<tr><td colspan="5" class="loading">جاري البحث...</td></tr>';

  const { data, error } = await sb.rpc('admin_search_customers', { p_query: query || null });

  if (error) {
    document.getElementById('customersBody').innerHTML =
      `<tr><td colspan="5" class="loading">خطأ: ${error.message}</td></tr>`;
    return;
  }
  if (!data || data.length === 0) {
    document.getElementById('customersBody').innerHTML =
      '<tr><td colspan="5" class="loading">مفيش نتائج</td></tr>';
    return;
  }

  document.getElementById('customersBody').innerHTML = data.map(c => `
    <tr class="clickable" onclick="openCustomer('${c.user_id}')">
      <td>${escapeHtml(c.business_name || c.user_name || '—')}</td>
      <td>${escapeHtml(c.email || '—')}</td>
      <td>${PLAN_LABELS[c.plan] || c.plan || '—'}</td>
      <td><span class="badge badge-${c.status || 'expired'}">${STATUS_LABELS[c.status] || c.status || '—'}</span></td>
      <td>${c.expires_at ? new Date(c.expires_at).toLocaleDateString('ar-EG') : '—'}</td>
    </tr>
  `).join('');
}

async function openCustomer(userId) {
  document.getElementById('customerModal').classList.remove('hidden');
  document.getElementById('customerModalContent').innerHTML = '<div class="loading">جاري التحميل...</div>';

  const { data, error } = await sb.rpc('admin_get_customer_detail', { p_user_id: userId });
  if (error) {
    document.getElementById('customerModalContent').innerHTML = `<div class="loading">خطأ: ${error.message}</div>`;
    return;
  }

  const p = data.profile || {};
  const subs = data.subscriptions || [];
  const currentSub = subs[0];
  const payments = data.payment_logs || [];
  const tickets = data.tickets || [];

  document.getElementById('customerModalContent').innerHTML = `
    <div class="modal-header">
      <h2>${escapeHtml(p.business_name || p.user_name || 'بدون اسم')}</h2>
      <button class="close-btn" onclick="closeModal()">✕</button>
    </div>

    <div class="info-row"><span class="k">الإيميل</span><span>${escapeHtml(p.email || '—')}</span></div>
    <div class="info-row"><span class="k">الموبايل</span><span>${escapeHtml(p.phone || '—')}</span></div>
    <div class="info-row"><span class="k">تاريخ التسجيل</span><span>${p.created_at ? new Date(p.created_at).toLocaleDateString('ar-EG') : '—'}</span></div>

    ${currentSub ? `
      <div class="section-title">الاشتراك الحالي</div>
      <div class="info-row"><span class="k">الخطة</span><span>${PLAN_LABELS[currentSub.plan] || currentSub.plan}</span></div>
      <div class="info-row"><span class="k">الحالة</span><span><span class="badge badge-${currentSub.status}">${STATUS_LABELS[currentSub.status] || currentSub.status}</span></span></div>
      <div class="info-row"><span class="k">ينتهي</span><span>${new Date(currentSub.expires_at).toLocaleDateString('ar-EG')}</span></div>
      <div class="info-row"><span class="k">تجديد تلقائي</span><span>${currentSub.auto_renewing ? 'نعم' : 'لأ'}</span></div>
    ` : '<div class="empty-note">مفيش اشتراك مسجل</div>'}

    <div class="action-row">
      <button class="btn btn-success btn-sm" onclick="extendSub('${userId}')">+ مدّد الاشتراك</button>
      <button class="btn btn-danger btn-sm" onclick="cancelSub('${userId}')">أوقف الاشتراك</button>
    </div>

    <div class="section-title">آخر عمليات الدفع (${payments.length})</div>
    <div class="mini-list">
      ${payments.length ? payments.map(pl => `
        <div class="mini-list-item">
          ${new Date(pl.created_at).toLocaleDateString('ar-EG')} — ${escapeHtml(pl.status || '')} — ${escapeHtml(pl.plan || '')}
        </div>
      `).join('') : '<div class="empty-note">مفيش سجل دفع</div>'}
    </div>

    <div class="section-title">تذاكر الدعم (${tickets.length})</div>
    <div class="mini-list">
      ${tickets.length ? tickets.map(t => `
        <div class="mini-list-item">
          <strong>${escapeHtml(t.subject)}</strong> — <span class="badge badge-${t.status === 'open' ? 'on_hold' : 'active'}">${t.status}</span>
        </div>
      `).join('') : '<div class="empty-note">مفيش تذاكر</div>'}
    </div>
  `;
}

function closeModal() {
  document.getElementById('customerModal').classList.add('hidden');
}

async function extendSub(userId) {
  const days = prompt('كام يوم عايز تضيف؟', '30');
  if (!days || isNaN(parseInt(days))) return;
  const reason = prompt('السبب (هيتسجل في سجل التدقيق):', 'دعم فني');

  const { error } = await sb.rpc('admin_extend_subscription', {
    p_user_id: userId, p_days: parseInt(days), p_reason: reason || ''
  });

  if (error) { alert('خطأ: ' + error.message); return; }
  alert('✅ تم التمديد');
  openCustomer(userId);
  loadStats();
  loadCustomers(document.getElementById('searchInput').value.trim());
}

async function cancelSub(userId) {
  if (!confirm('متأكد إنك عايز توقف الاشتراك ده؟')) return;
  const reason = prompt('السبب (هيتسجل في سجل التدقيق):', '');

  const { error } = await sb.rpc('admin_cancel_subscription', {
    p_user_id: userId, p_reason: reason || ''
  });

  if (error) { alert('خطأ: ' + error.message); return; }
  alert('✅ تم الإيقاف');
  openCustomer(userId);
  loadStats();
  loadCustomers(document.getElementById('searchInput').value.trim());
}

// ─── Tickets ─────────────────────────────────────────────────────────────

async function loadTickets() {
  const status = document.getElementById('ticketStatusFilter').value;
  document.getElementById('ticketsList').innerHTML = '<div class="loading">جاري التحميل...</div>';

  const { data, error } = await sb.rpc('admin_list_tickets', { p_status: status || null });
  if (error) {
    document.getElementById('ticketsList').innerHTML = `<div class="loading">خطأ: ${error.message}</div>`;
    return;
  }
  if (!data || data.length === 0) {
    document.getElementById('ticketsList').innerHTML = '<div class="empty-note">مفيش تذاكر</div>';
    return;
  }

  document.getElementById('ticketsList').innerHTML = data.map(t => `
    <div class="table-wrap" style="padding:16px;margin-bottom:10px;">
      <div style="display:flex;justify-content:space-between;margin-bottom:8px;">
        <strong>${escapeHtml(t.subject)}</strong>
        <span class="badge badge-${t.status === 'open' ? 'on_hold' : 'active'}">${t.status}</span>
      </div>
      <div style="font-size:12px;color:var(--text-dim);margin-bottom:6px;">
        ${escapeHtml(t.business_name || t.email || '')} — ${new Date(t.created_at).toLocaleDateString('ar-EG')}
      </div>
      <div style="font-size:13px;margin-bottom:10px;">${escapeHtml(t.message)}</div>
      <div class="action-row" style="margin-top:0;">
        <button class="btn btn-sm btn-outline" onclick="updateTicket('${t.id}','in_progress')">قيد المعالجة</button>
        <button class="btn btn-sm btn-success" onclick="updateTicket('${t.id}','resolved')">اتحلت</button>
        <button class="btn btn-sm btn-outline" onclick="updateTicket('${t.id}','closed')">قفل</button>
      </div>
    </div>
  `).join('');
}

async function updateTicket(id, status) {
  const notes = prompt('ملاحظات (اختياري):', '');
  const { error } = await sb.rpc('admin_update_ticket', {
    p_ticket_id: id, p_status: status, p_notes: notes || null
  });
  if (error) { alert('خطأ: ' + error.message); return; }
  loadTickets();
  loadStats();
}

// ─── Helpers ─────────────────────────────────────────────────────────────

function escapeHtml(str) {
  if (!str) return '';
  return String(str).replace(/[&<>"']/g, m => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[m]));
}

// ─── Init ────────────────────────────────────────────────────────────────
checkSession();
</script>
